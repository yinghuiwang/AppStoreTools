[project]
name = "asc-appstore-tools"
version = "0.1.26"
description = "CLI tool for bulk-uploading App Store Connect metadata"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["app-store", "app-store-connect", "cli", "metadata", "screenshots"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.0",
    "PyJWT>=2.8.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.0.0",
    "twine>=4.0.0",
    "pytest>=7.4.0",
    "cryptography>=41.0.0",
    "playwright>=1.43.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: browser end-to-end tests that require Playwright Chromium",
]

[project.scripts]
asc = "asc.cli:run_app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc"]

[tool.hatch.build.targets.wheel.force-include]
"src/asc/web/static/spa" = "asc/web/static/spa"
"src/asc/web/static/fonts.css" = "asc/web/static/fonts.css"
"src/asc/web/static/fonts" = "asc/web/static/fonts"
"src/asc/web/static/logo.svg" = "asc/web/static/logo.svg"
"src/asc/web/locales/zh.json" = "asc/web/locales/zh.json"
"src/asc/web/locales/en.json" = "asc/web/locales/en.json"
"src/asc/web/knowledge" = "asc/web/knowledge"
