{% extends "base.html" %}
{% block content %}
<div class="">
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-obsidian-50 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--accent-glow);">
        <svg class="w-4.5 h-4.5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
      </div>
      {{ t("guard.title") }}
    </h1>
  </div>

  <div class="space-y-6">
    <!-- Guard status -->
    <div class="card"
         x-data="{
           guard: null,
           savingNote: '',
           loadGuard() {
             return fetch('/api/guard/status')
               .then(r => r.json())
               .then(data => { this.guard = data; })
               .catch(() => { this.guard = null; });
           },
           appLabel(entry) {
             if (!entry || !entry.bound) return '';
             const name = entry.profile_name || entry.app_name || '';
             const id = entry.app_id || '';
             if (name && id) return `${name} (${id})`;
             return name || id || '';
           },
           saveNote(row) {
             const token = row.app_id;
             this.savingNote = token;
             return fetch('/api/guard/note', {
               method: 'POST',
               headers: {'Content-Type': 'application/x-www-form-urlencoded'},
               body: new URLSearchParams({app_id: row.app_id, note: row.note || ''})
             })
               .then(r => {
                 if (!r.ok) throw new Error('save failed');
                 return this.loadGuard();
               })
               .finally(() => { this.savingNote = ''; });
           }
         }"
         x-init="loadGuard()">
      <div class="card-header flex items-center gap-2">
        <svg class="w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
        <h2 class="text-xs uppercase tracking-widest text-obsidian-400 font-medium">{{ t("guard.title") }}</h2>
      </div>
      <div class="card-body">
        <template x-if="guard">
          <div>
            <!-- Status indicator -->
            <div class="flex items-center gap-3 mb-4">
              <div class="w-2 h-2 rounded-full" :class="guard.enabled ? 'bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.5)]' : 'bg-obsidian-600'"></div>
              <p class="text-sm font-medium"
                 :class="guard.enabled ? 'text-emerald-400' : 'text-obsidian-400'"
                 x-text="guard.enabled ? window.t('guard.enabled') : window.t('guard.disabled')"></p>
            </div>

            <!-- Current environment -->
            <template x-if="guard.current_environment">
              <div class="mb-5">
                <h3 class="text-[10px] uppercase tracking-widest text-obsidian-500 font-medium mb-3">{{ t("guard.current_env") }}</h3>
                <div class="rounded-lg p-4 space-y-4"
                     style="background: var(--bg-base); border: 1px solid var(--border-subtle);">
                  <div class="space-y-1.5">
                    <div class="flex items-baseline gap-2 flex-wrap">
                      <span class="text-[10px] uppercase tracking-widest text-obsidian-500">{{ t("guard.machine") }}</span>
                      <span class="text-xs text-obsidian-200 font-mono break-all"
                            x-text="guard.current_environment.machine.fingerprint"></span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-medium"
                            :class="guard.current_environment.machine.bound ? 'text-emerald-400' : 'text-obsidian-400'"
                            x-text="guard.current_environment.machine.bound ? window.t('guard.status_bound') : window.t('guard.status_unbound')"></span>
                    </div>
                    <template x-if="guard.current_environment.machine.bound">
                      <div class="text-xs text-obsidian-300">
                        <span class="text-obsidian-500">{{ t("guard.bound_app") }}:</span>
                        <span class="font-mono text-obsidian-200 ml-1" x-text="appLabel(guard.current_environment.machine)"></span>
                      </div>
                    </template>
                    <template x-if="guard.current_environment.machine.bound && guard.current_environment.machine.note">
                      <div class="text-xs text-obsidian-400">
                        <span class="text-obsidian-500">{{ t("guard.note") }}:</span>
                        <span class="ml-1 break-all" x-text="guard.current_environment.machine.note"></span>
                      </div>
                    </template>
                  </div>

                  <div class="space-y-1.5 pt-3 border-t border-obsidian-800">
                    <div class="flex items-baseline gap-2 flex-wrap">
                      <span class="text-[10px] uppercase tracking-widest text-obsidian-500">{{ t("guard.ip_address") }}</span>
                      <span class="text-xs text-obsidian-200 font-mono"
                            x-text="guard.current_environment.ip.address"></span>
                    </div>
                    <template x-if="!guard.current_environment.ip.available">
                      <p class="text-xs text-amber-500">{{ t("guard.ip_unavailable") }}</p>
                    </template>
                    <template x-if="guard.current_environment.ip.available">
                      <div class="space-y-1.5">
                        <div class="flex items-center gap-2">
                          <span class="text-xs font-medium"
                                :class="guard.current_environment.ip.bound ? 'text-emerald-400' : 'text-obsidian-400'"
                                x-text="guard.current_environment.ip.bound ? window.t('guard.status_bound') : window.t('guard.status_unbound')"></span>
                        </div>
                        <template x-if="guard.current_environment.ip.bound">
                          <div class="text-xs text-obsidian-300">
                            <span class="text-obsidian-500">{{ t("guard.bound_app") }}:</span>
                            <span class="font-mono text-obsidian-200 ml-1" x-text="appLabel(guard.current_environment.ip)"></span>
                          </div>
                        </template>
                        <template x-if="guard.current_environment.ip.bound && guard.current_environment.ip.note">
                          <div class="text-xs text-obsidian-400">
                            <span class="text-obsidian-500">{{ t("guard.note") }}:</span>
                            <span class="ml-1 break-all" x-text="guard.current_environment.ip.note"></span>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <!-- Bindings list -->
            <template x-if="guard.enabled && Object.keys(guard.bindings.machine).length + Object.keys(guard.bindings.ip).length + Object.keys(guard.bindings.credential).length > 0">
              <div>
                <h3 class="text-[10px] uppercase tracking-widest text-obsidian-500 font-medium mb-3">{{ t("guard.bindings") }}</h3>
                <div class="space-y-3">
                  <template x-for="(row, idx) in (() => {
                    const apps = {};
                    const bindings = guard.bindings;
                    const appNotes = guard.app_notes || {};
                    const append = (row, field, value) => {
                      if (!value) return;
                      if (row[field] && row[field].split(', ').includes(value)) return;
                      row[field] = row[field] ? `${row[field]}, ${value}` : value;
                    };
                    for (const [fp, info] of Object.entries(bindings.machine || {})) {
                      const appId = String(info.app_id || '');
                      const key = info.profile_name || info.app_name || appId;
                      if (!apps[key]) apps[key] = {profile_name: info.profile_name || '', app_name: info.app_name || '', app_id: appId, machine: '', ip: '', bound_at: info.bound_at, note: appNotes[appId] || ''};
                      append(apps[key], 'machine', fp);
                      if (info.bound_at) apps[key].bound_at = info.bound_at;
                    }
                    for (const [ip, info] of Object.entries(bindings.ip || {})) {
                      const appId = String(info.app_id || '');
                      const key = info.profile_name || info.app_name || appId;
                      if (!apps[key]) apps[key] = {profile_name: info.profile_name || '', app_name: info.app_name || '', app_id: appId, machine: '', ip: '', bound_at: info.bound_at, note: appNotes[appId] || ''};
                      append(apps[key], 'ip', ip);
                      if (info.bound_at) apps[key].bound_at = info.bound_at;
                    }
                    for (const [key_id, info] of Object.entries(bindings.credential || {})) {
                      const appId = String(info.app_id || '');
                      const key = info.profile_name || info.app_name || appId;
                      if (!apps[key]) apps[key] = {profile_name: info.profile_name || '', app_name: info.app_name || '', app_id: appId, machine: '', ip: '', bound_at: info.bound_at, note: appNotes[appId] || ''};
                      if (info.bound_at) apps[key].bound_at = info.bound_at;
                    }
                    const sorted = Object.values(apps);
                    sorted.sort((a, b) => {
                      if (a.profile_name === guard.current_profile) return -1;
                      if (b.profile_name === guard.current_profile) return 1;
                      return 0;
                    });
                    return sorted;
                  })()" :key="idx">
                    <div class="rounded-lg p-4 space-y-3"
                         style="background: var(--bg-base); border: 1px solid var(--border-subtle);"
                         :class="row.profile_name === guard.current_profile ? '' : ''">
                      <!-- Profile header -->
                      <div class="flex items-center gap-2">
                        <span x-text="row.profile_name === guard.current_profile ? '★' : ''"
                              :class="row.profile_name === guard.current_profile ? 'text-amber-500' : 'text-obsidian-600'"></span>
                        <span class="font-mono text-sm font-medium text-obsidian-100" x-text="row.profile_name || row.app_id"></span>
                        <span x-show="row.app_name && row.app_name !== row.profile_name" class="text-xs text-obsidian-400" x-text="row.app_name"></span>
                        <span x-show="row.profile_name === guard.current_profile" class="badge badge-info text-[10px]">{{ t("guard.current") }}</span>
                      </div>
                      <!-- Detail grid -->
                      <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                        <template x-if="row.app_id">
                          <div>
                            <span class="text-[10px] uppercase tracking-widest text-obsidian-500 block mb-0.5">App ID</span>
                            <span class="text-xs text-obsidian-200 font-mono break-all" x-text="row.app_id"></span>
                          </div>
                        </template>
                        <template x-if="row.machine">
                          <div>
                            <span class="text-[10px] uppercase tracking-widest text-obsidian-500 block mb-0.5">{{ t("guard.machine") }}</span>
                            <span class="text-xs text-obsidian-200 font-mono break-all" x-text="row.machine"></span>
                          </div>
                        </template>
                        <template x-if="row.ip">
                          <div>
                            <span class="text-[10px] uppercase tracking-widest text-obsidian-500 block mb-0.5">{{ t("guard.ip") }}</span>
                            <span class="text-xs text-obsidian-200 font-mono" x-text="row.ip"></span>
                          </div>
                        </template>
                        <template x-if="row.bound_at">
                          <div>
                            <span class="text-[10px] uppercase tracking-widest text-obsidian-500 block mb-0.5">{{ t("guard.bound_at") }}</span>
                            <span class="text-xs text-obsidian-400 font-mono" x-text="row.bound_at.slice(0,19).replace('T',' ')"></span>
                          </div>
                        </template>
                      </div>
                      <!-- Inline note editor -->
                      <template x-if="row.app_id">
                        <div class="pt-3 border-t border-obsidian-800">
                          <span class="text-[10px] uppercase tracking-widest text-obsidian-500 block mb-1.5">{{ t("guard.note") }}</span>
                          <div class="flex items-center gap-2">
                            <input class="field-input text-xs h-9 flex-1"
                                   type="text"
                                   placeholder="{{ t('guard.note') }}"
                                   x-model="row.note">
                            <button type="button"
                                    class="btn-secondary text-xs h-9 px-3 shrink-0"
                                    @click="saveNote(row)"
                                    :disabled="savingNote === row.app_id">
                              <span x-text="savingNote === row.app_id ? window.t('guard.saving') : window.t('guard.save_note')"></span>
                            </button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>

            <template x-if="guard.enabled && Object.keys(guard.bindings.machine).length === 0 && Object.keys(guard.bindings.ip).length === 0 && Object.keys(guard.bindings.credential).length === 0">
              <p class="text-xs text-obsidian-500">{{ t("guard.empty") }}</p>
            </template>

            <div class="mt-4 pt-4 border-t border-obsidian-700 space-y-1.5">
              <p class="text-[11px] text-obsidian-500">{{ t("guard.help1") }}</p>
              <p class="text-[11px] text-obsidian-500">{{ t("guard.help2") }}<code class="font-mono text-amber-550 bg-obsidian-800 px-1.5 py-0.5 rounded">asc guard enable/disable/unbind</code></p>
            </div>
          </div>
        </template>
        <template x-if="!guard">
          <div class="flex items-center gap-2 text-sm text-red-400">
            <div class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(248,113,113,0.4)]"></div>
            {{ t("guard.load_failed") }}
          </div>
        </template>
      </div>
    </div>

  </div>
</div>
{% endblock %}
