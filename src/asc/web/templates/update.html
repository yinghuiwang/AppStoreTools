{% extends "base.html" %}
{% block content %}
<div>
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-obsidian-50 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--accent-glow);">
        <svg class="w-4.5 h-4.5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
      </div>
      {{ t("update.title") }}
    </h1>
    <p class="text-sm text-obsidian-400 mt-1">{{ t("update.subtitle") }}</p>
  </div>

  <div x-data="{ checkResult: null, checking: false, step: 1, taskId: null, status: 'idle', canceling: false, selectedTab: 'specific', branchOptions: [], branchesLoading: false, branchError: '', selectedBranch: '', versionOptions: [], versionsLoading: false, versionError: '', selectedVersion: '', currentVersion: {{ tool_version|tojson }}, currentCommit: {{ tool_commit|tojson }}, isEditable: {{ is_editable|tojson }} }">

    <!-- Editable mode warning (shown immediately when detected) -->
    <template x-if="isEditable">
      <div class="card mb-6 border border-amber-500/40" style="background: rgba(245, 158, 11, 0.08);">
        <div class="card-body space-y-2">
          <div class="flex items-start gap-3">
            <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 bg-amber-500/15">
              <svg class="w-4.5 h-4.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
            </div>
            <div class="min-w-0 space-y-1">
              <h2 class="font-semibold text-amber-300">{{ t("update.editable_title") }}</h2>
              <p class="text-sm text-obsidian-200">{{ t("update.editable_body") }}</p>
              <p class="text-sm text-obsidian-400">{{ t("update.editable_hint") }}</p>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- Check status card -->
    <div class="card mb-6">
      <div class="card-body">
        <div class="flex items-center justify-between gap-4 flex-wrap">
          <div class="flex items-center gap-4 flex-wrap">
            <button @click="checkUpdate()" :disabled="checking" class="btn-ghost flex items-center gap-2">
              <svg class="w-4 h-4" :class="checking ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
              <span x-text="checking ? window.t('update.checking') : window.t('update.title')"></span>
            </button>
            <template x-if="checkResult">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded-full flex items-center justify-center"
                     :class="{
                       'bg-emerald-500/15': checkResult.level === 'success',
                       'bg-amber-500/15': checkResult.level === 'info',
                       'bg-red-500/15': checkResult.level === 'error',
                       'bg-obsidian-700': checkResult.level === 'warning',
                     }">
                  <svg class="w-3.5 h-3.5"
                       :class="{
                         'text-emerald-400': checkResult.level === 'success',
                         'text-amber-400': checkResult.level === 'info' || checkResult.level === 'warning',
                         'text-red-400': checkResult.level === 'error',
                       }"
                       fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <template x-if="checkResult.level === 'success'">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/>
                    </template>
                    <template x-if="checkResult.level === 'info'">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </template>
                    <template x-if="checkResult.level === 'error' || checkResult.level === 'warning'">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                    </template>
                  </svg>
                </div>
                <span class="text-sm" x-text="checkResult.message"></span>
              </div>
            </template>
          </div>

          <div class="text-xs text-obsidian-500">
            {{ t("update.current") }}
            <span class="font-mono text-obsidian-400" x-text="(checkResult && checkResult.detail && checkResult.detail.current) || currentVersion"></span>
            <template x-if="(checkResult && checkResult.detail && checkResult.detail.current_commit) || currentCommit">
              <span class="font-mono text-obsidian-400" x-text="`(commit ${(checkResult && checkResult.detail && checkResult.detail.current_commit) || currentCommit})`"></span>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- Latest version install -->
    <template x-if="checkResult && checkResult.detail && !checkResult.detail.is_latest">
      <div class="card mb-6">
        <div class="card-body space-y-4">
          <div class="flex items-center gap-2 text-amber-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
            <span class="font-medium">
              {{ t("update.found") }} <span x-text="checkResult.detail.latest"></span>
              <template x-if="checkResult.detail.latest_commit">
                <span class="font-mono" x-text="`(commit ${checkResult.detail.latest_commit})`"></span>
              </template>
            </span>
          </div>
          <template x-if="isEditable">
            <div class="rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-3 space-y-2">
              <p class="text-sm text-amber-300 font-medium">{{ t("update.editable_latest_blocked") }}</p>
              <p class="text-sm text-obsidian-400">{{ t("update.editable_hint") }}</p>
            </div>
          </template>
          <template x-if="!isEditable">
            <form @submit.prevent="runUpdate('', 'latest')">
              <p class="text-sm text-obsidian-400 mb-3">
                {{ t("update.install_latest") }} <span class="text-amber-400 font-medium" x-text="checkResult.detail.latest"></span>
                <template x-if="checkResult.detail.latest_commit">
                  <span class="text-amber-400 font-mono" x-text="`(commit ${checkResult.detail.latest_commit})`"></span>
                </template>
              </p>
              <button type="submit" class="btn-primary">
                {{ t("update.install_now") }}
              </button>
            </form>
          </template>
        </div>
      </div>
    </template>
    <!-- Already up to date -->
    <template x-if="checkResult && checkResult.detail && checkResult.detail.is_latest">
      <div class="card mb-6">
        <div class="card-body text-center py-8">
          <div class="w-12 h-12 rounded-full bg-emerald-500/15 flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
          </div>
          <h3 class="text-lg font-medium text-obsidian-100 mb-1">{{ t("update.up_to_date") }}</h3>
          <p class="text-sm text-obsidian-400">
            {{ t("update.current_short") }} <span class="font-mono text-amber-400" x-text="checkResult.detail.current"></span>
            <template x-if="checkResult.detail.current_commit">
              <span class="font-mono text-amber-400" x-text="`(commit ${checkResult.detail.current_commit})`"></span>
            </template>
            {{ t("update.badge_latest") }}
          </p>
        </div>
      </div>
    </template>

    <!-- Advanced install (always available) -->
    <div class="card">
      <div class="card-body space-y-4">
        <div>
          <h2 class="font-semibold text-obsidian-100">{{ t("update.advanced") }}</h2>
        </div>

        <div class="flex gap-1 p-1 rounded-lg" style="background: var(--accent-glow);">
          <button @click="selectedTab = 'specific'; loadVersions()" type="button"
                  class="flex-1 py-2 px-3 rounded-md text-sm font-medium transition-all duration-150"
                  :class="selectedTab === 'specific' ? 'bg-amber-500 text-obsidian-900' : 'text-obsidian-300 hover:text-obsidian-100'">
            {{ t("update.pin_version") }}
          </button>
          <button @click="selectedTab = 'branch'; loadBranches()" type="button"
                  class="flex-1 py-2 px-3 rounded-md text-sm font-medium transition-all duration-150"
                  :class="selectedTab === 'branch' ? 'bg-amber-500 text-obsidian-900' : 'text-obsidian-300 hover:text-obsidian-100'">
            {{ t("update.pin_branch") }}
          </button>
        </div>

        <form x-show="selectedTab === 'specific'" @submit.prevent="runUpdate(selectedVersion || $el.querySelector('[name=version]')?.value || '', 'specific')">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs uppercase tracking-widest text-obsidian-400 font-medium block">{{ t("update.version_label") }}</label>
            <button type="button" class="text-xs text-amber-500 hover:text-amber-400" @click="loadVersions(true)" x-text="versionsLoading ? window.t('common.loading') : window.t('update.refresh_versions')"></button>
          </div>
          <div class="flex gap-3 items-start">
            <div class="flex-1 min-w-0">
              <template x-if="versionOptions.length > 0">
                <select name="version" class="field-input w-full" x-model="selectedVersion">
                  <template x-for="ver in versionOptions" :key="ver">
                    <option :value="ver" x-text="ver"></option>
                  </template>
                </select>
              </template>
              <template x-if="versionOptions.length === 0">
                <input type="text" name="version" class="field-input w-full" placeholder="{{ t('update.version_ph') }}" x-model="selectedVersion">
              </template>
              <template x-if="versionError">
                <p class="text-xs text-amber-400 mt-2" x-text="versionError"></p>
              </template>
            </div>
            <button type="submit" class="btn-primary whitespace-nowrap">{{ t("update.install_version") }}</button>
          </div>
        </form>

        <form x-show="selectedTab === 'branch'" @submit.prevent="runUpdateBranch(selectedBranch || $el.querySelector('[name=branch]')?.value || '')">
          <div class="flex items-center justify-between mb-2">
            <label class="text-xs uppercase tracking-widest text-obsidian-400 font-medium block">{{ t("update.branch_label") }}</label>
            <button type="button" class="text-xs text-amber-500 hover:text-amber-400" @click="loadBranches(true)" x-text="branchesLoading ? window.t('common.loading') : window.t('update.refresh_branches')"></button>
          </div>
          <div class="flex gap-3 items-start">
            <div class="flex-1 min-w-0">
              <template x-if="branchOptions.length > 0">
                <select name="branch" class="field-input w-full" x-model="selectedBranch">
                  <template x-for="branch in branchOptions" :key="branch">
                    <option :value="branch" x-text="branch"></option>
                  </template>
                </select>
              </template>
              <template x-if="branchOptions.length === 0">
                <input type="text" name="branch" class="field-input w-full" placeholder="{{ t('update.branch_ph') }}" x-model="selectedBranch">
              </template>
              <template x-if="branchError">
                <p class="text-xs text-amber-400 mt-2" x-text="branchError"></p>
              </template>
            </div>
            <button type="submit" class="btn-primary whitespace-nowrap">{{ t("update.install_branch") }}</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Progress card -->
    <div x-show="step === 2" class="card mt-6">
      <div class="card-body">
        <div class="flex items-center justify-between mb-5">
          <h2 class="font-semibold text-obsidian-100" x-text="status === 'done' ? window.t('update.done') : status === 'error' ? window.t('update.failed') : status === 'canceled' ? window.t('update.canceled') : window.t('update.running')"></h2>
          <div class="flex items-center gap-3">
            <template x-if="status === 'done'">
              <div class="w-7 h-7 rounded-full flex items-center justify-center bg-emerald-500/15">
                <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
              </div>
            </template>
            <template x-if="status === 'error'">
              <div class="w-7 h-7 rounded-full flex items-center justify-center bg-red-500/15">
                <svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
              </div>
            </template>
            <button type="button"
                    data-task-log-open
                    class="text-xs text-amber-550 hover:text-amber-500 cursor-pointer transition-colors duration-150 font-medium"
                    @click="TaskLogDrawer.open(taskId, updateLogOptions())">{{ t("common.logs") }}</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Note -->
    <div class="mt-6 rounded-lg border border-obsidian-700/80 bg-obsidian-900/40 px-4 py-3 text-sm text-obsidian-300">
      <p>{{ t("update.note") }}</p>
    </div>
  </div>
</div>

<script>
function updateLogOptions() {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  return {
    title: window.t('update.log_title'),
    onDone: () => { d.status = 'done'; checkUpdate(); },
    onError: () => { d.status = 'error'; },
    onCanceled: () => { d.status = 'canceled'; d.canceling = false; }
  };
}

function startUpdateTask(taskId) {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  d.status = 'running';
  d.canceling = false;
  TaskLogDrawer.open(taskId, updateLogOptions());
}

function checkUpdate() {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  d.checking = true;
  fetch('/api/update/check')
    .then(r => r.json())
    .then(data => {
      d.checkResult = data;
      if (data.detail && data.detail.current) {
        d.currentVersion = data.detail.current;
      }
      if (data.detail && data.detail.current_commit) {
        d.currentCommit = data.detail.current_commit;
      }
      if (data.detail && typeof data.detail.is_editable === 'boolean') {
        d.isEditable = data.detail.is_editable;
      }
      d.checking = false;
    })
    .catch(() => {
      d.checkResult = {ok: false, level: 'error', message: window.t('update.check_failed')};
      d.checking = false;
    });
}

function loadVersions(force = false) {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  if (d.versionsLoading || (!force && d.versionOptions.length > 0)) return;

  d.versionsLoading = true;
  d.versionError = '';
  fetch('/api/update/versions')
    .then(r => r.json())
    .then(data => {
      d.versionOptions = data.versions || [];
      if (!d.versionOptions.includes(d.selectedVersion)) {
        d.selectedVersion = d.versionOptions[0] || d.selectedVersion || '';
      }
      d.versionError = data.ok ? '' : (data.message || window.t('update.version_list_failed'));
      d.versionsLoading = false;
    })
    .catch(() => {
      d.versionOptions = [];
      d.versionError = window.t('update.version_list_failed');
      d.versionsLoading = false;
    });
}

function loadBranches(force = false) {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  if (d.branchesLoading || (!force && d.branchOptions.length > 0)) return;

  d.branchesLoading = true;
  d.branchError = '';
  fetch('/api/update/branches')
    .then(r => r.json())
    .then(data => {
      d.branchOptions = data.branches || [];
      if (!d.branchOptions.includes(d.selectedBranch)) {
        d.selectedBranch = d.branchOptions[0] || d.selectedBranch || '';
      }
      d.branchError = data.ok ? '' : (data.message || window.t('update.branch_list_failed'));
      d.branchesLoading = false;
    })
    .catch(() => {
      d.branchOptions = [];
      d.branchError = window.t('update.branch_list_failed');
      d.branchesLoading = false;
    });
}

function runUpdate(version, mode = 'specific') {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  const selectedVersion = (version || '').trim();
  if (mode === 'specific' && !selectedVersion) {
    d.versionError = window.t('update.version_required');
    return;
  }
  fetch('/api/update/run', {
    method: 'POST',
    body: new URLSearchParams({version: selectedVersion}),
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
  })
  .then(r => r.json())
  .then(data => {
    d.taskId = data.task_id;
    d.step = 2;
    startUpdateTask(data.task_id);
  });
}

function runUpdateBranch(branch) {
  const root = document.querySelector('[x-data]');
  const d = Alpine.$data(root);
  const selectedBranch = (branch || '').trim();
  if (!selectedBranch) {
    d.branchError = window.t('update.branch_required');
    return;
  }
  fetch('/api/update/run', {
    method: 'POST',
    body: new URLSearchParams({branch: selectedBranch}),
    headers: {'Content-Type': 'application/x-www-form-urlencoded'}
  })
  .then(r => r.json())
  .then(data => {
    d.taskId = data.task_id;
    d.step = 2;
    startUpdateTask(data.task_id);
  });
}

// Auto check + load versions on load
document.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    checkUpdate();
    loadVersions();
  }, 500);
});
</script>
{% endblock %}
