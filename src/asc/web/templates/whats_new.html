{% extends "base.html" %}
{% block content %}
<div class="">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-2xl font-bold tracking-tight text-obsidian-50 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--accent-glow);">
        <svg class="w-[18px] h-[18px] shrink-0 text-amber-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 0 1 .865-.501 48.172 48.172 0 0 0 3.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z"/></svg>
      </div>
      {{ t("whats_new.title") }}
    </h1>
  </div>

  <div id="whats-new-state" x-data="{
    step: 1,
    taskId: null,
    status: 'idle',
    canceling: false,
    progress: 0,
    progressMsg: '',
    submitting: false,
    checkLoading: true,
    checkStatusMessage: window.t('whats_new.checking_detail'),
    checkResult: null,
    translateMode: false,
    sourceLocale: 'auto',
    text: '',
    translations: {},
    translateError: '',
    availableLocales: [],
    version: '',
    editingLocale: null,
    editText: ''
  }"
  @check-result.window="checkResult = $event.detail"
  @translations-result.window="translations = $event.detail; step = 2"
  @run-result.window="taskId = $event.detail.task_id; step = 3; startWhatsNewTask(taskId)">

    <!-- Environment check result (shown on mount) -->
    <template x-if="checkLoading">
      <div class="mb-5 rounded-lg p-4 text-sm bg-amber-500/10 text-amber-400 border border-amber-500/20">
        <div class="flex items-start gap-2.5">
          <svg class="w-4 h-4 mt-0.5 animate-spin shrink-0" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <div>
            <p class="font-medium">{{ t("whats_new.checking") }}</p>
            <p class="text-xs mt-1 opacity-80" x-text="checkStatusMessage"></p>
          </div>
        </div>
      </div>
    </template>

    <template x-if="checkResult">
      <div class="mb-5 rounded-lg p-4 text-sm"
           :class="{
             'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20': checkResult.level === 'success',
             'bg-amber-500/10 text-amber-400 border border-amber-500/20': checkResult.level === 'warning',
             'bg-red-500/10 text-red-400 border border-red-500/20': checkResult.level === 'error',
           }">
        <p class="font-medium" x-text="checkResult.message"></p>
        <template x-if="checkResult.detail && checkResult.detail.version">
          <p class="text-xs mt-1 opacity-80"
             x-text="window.t('whats_new.version_locales', { version: checkResult.detail.version, n: ((checkResult.detail.locales || []).length), locales: ((checkResult.detail.locales || []).join(', ')) })"></p>
        </template>
        <template x-if="checkResult.level === 'error'">
          <button type="button"
                  class="mt-3 text-xs px-2.5 py-1.5 rounded border border-red-400/30 text-red-300 hover:text-red-100 hover:border-red-300/60 transition-colors duration-150"
                  @click="runWhatsNewCheck()">
            {{ t("whats_new.recheck") }}
          </button>
        </template>
      </div>
    </template>

    <!-- Step 1: Form -->
    <div x-show="step === 1">
      <div class="card">
        <div class="card-body space-y-5">

          <!-- Source locale -->
          <div>
            <label for="source-locale-select" class="text-xs uppercase tracking-widest text-obsidian-400 font-medium mb-2 block">{{ t("whats_new.source_lang") }}</label>
            <select id="source-locale-select"
                    x-model="sourceLocale"
                    class="field-select w-full">
              <option value="auto">{{ t("whats_new.auto_detect") }}</option>
              <template x-for="locale in availableLocales" :key="locale">
                <option :value="locale" x-text="locale"></option>
              </template>
            </select>
          </div>

          <!-- Update notes textarea -->
          <div>
            <label for="update-text" class="text-xs uppercase tracking-widest text-obsidian-400 font-medium mb-2 block">{{ t("whats_new.text") }}</label>
            <textarea id="update-text"
                      x-model="text"
                      rows="5"
                      class="field-input w-full resize-y"
                      placeholder="{{ t('whats_new.placeholder') }}"></textarea>
          </div>

          <!-- Translate mode checkbox -->
          <div>
            <label class="flex items-center gap-2.5 text-sm text-obsidian-300 cursor-pointer">
              <input type="checkbox" x-model="translateMode" class="w-4 h-4">
              <span>{{ t("whats_new.translate_mode") }}</span>
            </label>
          </div>

          <template x-if="translateError">
            <div class="rounded-lg p-3 text-sm bg-red-500/10 text-red-300 border border-red-500/20" x-text="translateError"></div>
          </template>

          <!-- Actions -->
          <div class="flex flex-wrap gap-3 pt-3 border-t border-obsidian-700">
            <!-- Preview translate (only when translateMode is true) -->
            <button type="button"
                    x-show="translateMode"
                    class="btn-ghost"
                    :disabled="submitting || !text.trim()"
                    @click="
                      submitting = true;
                      translateError = '';
                      fetch('/api/whats-new/translate', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({source_locale: sourceLocale, text: text})
                      })
                        .then(r => r.json().then(data => {
                          if (!r.ok || data.error) throw new Error(data.error || window.t('whats_new.translate_failed'));
                          return data;
                        }))
                        .then(data => {
                          if (!data.task_id) throw new Error(window.t('whats_new.translate_failed'));
                          taskId = data.task_id;
                          status = 'running';
                          progress = 0;
                          progressMsg = '';
                          TaskLogDrawer.open(taskId, {
                            title: window.t('whats_new.log_title_upload'),
                            onProgress: (p) => {
                              if (!p) return;
                              if (p.pct != null) progress = p.pct;
                              progressMsg = p.msg || '';
                            },
                            onDone: () => {
                              fetch('/api/task/' + encodeURIComponent(taskId) + '/status')
                                .then(r => r.json())
                                .then(st => {
                                  const result = st.result || {};
                                  translations = result.translations || {};
                                  if (!Object.keys(translations).length) {
                                    throw new Error(window.t('whats_new.no_results'));
                                  }
                                  status = 'done';
                                  progress = 100;
                                  submitting = false;
                                  step = 2;
                                })
                                .catch(err => {
                                  translateError = err.message || window.t('whats_new.translate_failed');
                                  status = 'error';
                                  submitting = false;
                                });
                            },
                            onError: (msg) => {
                              translateError = msg || window.t('whats_new.translate_failed');
                              status = 'error';
                              submitting = false;
                            },
                            onCanceled: () => {
                              translateError = window.t('whats_new.canceled_msg');
                              status = 'canceled';
                              canceling = false;
                              submitting = false;
                            }
                          });
                        })
                        .catch(err => {
                          translateError = err.message || window.t('whats_new.translate_failed');
                          submitting = false;
                        });
                    ">
              <span x-show="!submitting">{{ t("whats_new.preview_translate") }}</span>
              <span x-show="submitting" class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                {{ t("whats_new.processing") }}
              </span>
            </button>
            <!-- Translate and upload in one step -->
            <button type="button"
                    x-show="translateMode"
                    class="btn-primary"
                    :disabled="submitting || !text.trim()"
                    @click="
                      submitting = true;
                      translateError = '';
                      fetch('/api/whats-new/run', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({text: text, source_locale: sourceLocale, translate: true, dry_run: 0})
                      })
                        .then(r => r.json().then(data => {
                          if (!r.ok || data.error) throw new Error(data.error || window.t('whats_new.upload_failed'));
                          return data;
                        }))
                        .then(data => {
                          taskId = data.task_id;
                          step = 3;
                          submitting = false;
                          startWhatsNewTask(taskId);
                        })
                        .catch(err => {
                          translateError = err.message || window.t('whats_new.upload_failed');
                          submitting = false;
                        });
                    ">
              <span x-show="!submitting">{{ t("whats_new.translate_upload") }}</span>
              <span x-show="submitting" class="flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                {{ t("whats_new.processing") }}
              </span>
            </button>
            <!-- Direct upload (no translate) -->
            <button type="button"
                    x-show="!translateMode"
                    class="btn-ghost"
                    :disabled="submitting || !text.trim()"
                    @click="
                      submitting = true;
                      translateError = '';
                      fetch('/api/whats-new/run', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({text: text, source_locale: sourceLocale, dry_run: 0})
                      })
                        .then(r => r.json())
                        .then(data => {
                          taskId = data.task_id;
                          step = 3;
                          submitting = false;
                          startWhatsNewTask(taskId);
                        })
                        .catch(() => { submitting = false; });
                    ">
              {{ t("whats_new.upload_direct") }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Step 2: Translation Preview -->
    <div x-show="step === 2 && translateMode">
      <div class="mb-5 flex items-center gap-3">
        <button type="button"
                class="btn-ghost flex items-center gap-1.5"
                @click="step = 1; translations = {}">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
          {{ t("whats_new.back") }}
        </button>
        <h2 class="text-lg font-semibold text-obsidian-100">{{ t("whats_new.preview_title") }}</h2>
      </div>

      <div class="space-y-4 mb-6">
        <template x-for="(transText, locale) in translations" :key="locale">
          <div class="card">
            <div class="card-header flex items-center justify-between">
              <h3 class="text-sm font-medium text-obsidian-200" x-text="locale"></h3>
              <button type="button"
                      class="text-xs text-amber-550 hover:text-amber-500 cursor-pointer transition-colors duration-150 font-medium"
                      @click="editingLocale = locale; editText = transText">
                {{ t("common.edit") }}
              </button>
            </div>
            <div class="card-body">
              <p class="text-sm text-obsidian-200 whitespace-pre-wrap" x-text="transText"></p>
            </div>
          </div>
        </template>
      </div>

      <!-- Bottom actions -->
      <div class="flex gap-3">
        <button type="button"
                class="btn-ghost"
                @click="step = 1; translations = {}">
          {{ t("common.cancel") }}
        </button>
        <button type="button"
                class="btn-ghost"
                @click="
                  fetch('/api/whats-new/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text, source_locale: sourceLocale, translations: translations, dry_run: 1})
                  })
                    .then(r => r.json())
                    .then(data => { taskId = data.task_id; step = 3; startWhatsNewTask(taskId); });
                ">
          {{ t("whats_new.preview_dry") }}
        </button>
        <button type="button"
                class="btn-primary"
                @click="
                  fetch('/api/whats-new/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text, source_locale: sourceLocale, translations: translations, dry_run: 0})
                  })
                    .then(r => r.json())
                    .then(data => { taskId = data.task_id; step = 3; startWhatsNewTask(taskId); });
                ">
          {{ t("whats_new.confirm_upload") }}
        </button>
      </div>
    </div>

    <!-- Step 3: Execution Panel -->
    <div x-show="step === 3">
      <div class="card">
        <div class="card-body">
          <div class="flex items-center justify-between mb-5">
            <h2 class="font-semibold text-obsidian-100 flex items-center gap-2.5" x-text="status === 'done' ? window.t('whats_new.done') : status === 'error' ? window.t('whats_new.failed') : status === 'canceled' ? window.t('whats_new.canceled') : window.t('whats_new.running')">
            </h2>
            <div class="flex items-center gap-3">
              <template x-if="status === 'done'">
                <div class="w-7 h-7 rounded-full flex items-center justify-center bg-emerald-500/15">
                  <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
                </div>
              </template>
              <template x-if="status === 'error'">
                <div class="w-7 h-7 rounded-full flex items-center justify-center bg-red-500/15">
                  <svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>
                </div>
              </template>
              <template x-if="status === 'running'">
                <div class="w-7 h-7 rounded-full flex items-center justify-center" style="background: var(--accent-glow);">
                  <svg class="w-4 h-4 text-amber-500 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </div>
              </template>
              <button type="button"
                      data-task-log-open
                      class="text-xs text-amber-550 hover:text-amber-500 cursor-pointer transition-colors duration-150 font-medium"
                      @click="TaskLogDrawer.open(taskId, whatsNewLogOptions())">{{ t("common.logs") }}</button>
              <button type="button"
                      x-show="status === 'running'"
                      class="text-xs text-red-400 hover:text-red-300 cursor-pointer transition-colors duration-150 font-medium"
                      :disabled="canceling"
                      @click="cancelTask(taskId, () => { canceling = true; progressMsg = window.t('whats_new.canceling_msg'); })"
                      x-text="canceling ? window.t('common.canceling') : window.t('common.cancel_upload')"></button>
              <button type="button" class="text-xs text-amber-550 hover:text-amber-500 cursor-pointer transition-colors duration-150 font-medium" @click="step=1; status='idle'; taskId=null">{{ t("common.retry") }}</button>
            </div>
          </div>

          <!-- Progress -->
          <div class="progress-track mb-2">
            <div class="progress-fill" :style="`width: ${progress}%`"></div>
          </div>
          <div class="flex items-center justify-between mb-5">
            <p class="text-xs text-obsidian-400" x-text="progressMsg"></p>
            <span class="text-xs font-mono text-obsidian-500 tabular-nums" x-text="progress > 0 ? progress + '%' : ''"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div x-show="editingLocale !== null"
         class="fixed inset-0 flex items-center justify-center z-50"
         style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);"
         @click.self="editingLocale = null">
      <div class="card w-[500px]">
        <div class="card-header flex items-center justify-between">
          <h3 class="text-xs uppercase tracking-widest text-obsidian-400 font-medium" x-text="window.t('whats_new.edit_locale', { locale: editingLocale || '' })"></h3>
          <button @click="editingLocale = null" class="text-obsidian-500 hover:text-obsidian-300 cursor-pointer transition-colors duration-150 p-1 rounded focus-ring">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="card-body">
          <textarea x-model="editText"
                    rows="6"
                    class="field-input w-full resize-y"></textarea>
        </div>
        <div class="px-5 py-3 border-t border-obsidian-700 flex justify-end gap-2">
          <button @click="editingLocale = null" class="btn-ghost">{{ t("common.cancel") }}</button>
          <button @click="
            if (editingLocale) {
              translations[editingLocale] = editText;
            }
            editingLocale = null;
          " class="btn-primary">{{ t("common.save") }}</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function runWhatsNewCheck() {
  const root = document.getElementById('whats-new-state');
  const d = root ? Alpine.$data(root) : null;
  if (d) {
    d.checkLoading = true;
    d.checkResult = null;
    d.checkStatusMessage = window.t('whats_new.checking_detail');
  }
  fetch('/api/whats-new/check')
    .then(r => r.json())
    .then(data => {
      window.dispatchEvent(new CustomEvent('check-result', {detail: data}));
      if (!d) return;
      const locales = data.detail?.available_locales || data.detail?.locales || [];
      d.checkLoading = false;
      d.checkStatusMessage = data.message || window.t('whats_new.check_done');
      if (locales.length) {
        d.availableLocales = locales;
      }
      if (data.detail && data.detail.version) {
        d.version = data.detail.version;
      }
    })
    .catch(e => {
      if (!d) return;
      d.checkLoading = false;
      d.checkResult = {
        ok: false,
        level: 'error',
        message: window.t('whats_new.check_failed_prefix') + e.message,
        detail: {},
      };
    });
}

document.addEventListener('DOMContentLoaded', () => {
  runWhatsNewCheck();
});

function cancelTask(taskId, beforeCancel) {
  if (!taskId) return;
  if (!confirm(window.t('whats_new.confirm_cancel'))) return;
  if (beforeCancel) beforeCancel();
  fetch(`/api/task/${taskId}/cancel`, {method: 'POST'})
    .catch(() => {
      const root = document.getElementById('whats-new-state');
      const d = Alpine.$data(root);
      d.canceling = false;
    });
}

function whatsNewLogOptions() {
  const root = document.getElementById('whats-new-state');
  const d = Alpine.$data(root);
  return {
    title: window.t('whats_new.log_title_upload'),
    onProgress: (progress) => {
      if (!progress) return;
      if (progress.pct != null) d.progress = progress.pct;
      d.progressMsg = progress.msg || '';
    },
    onDone: () => { d.status = 'done'; d.progress = 100; },
    onError: () => { d.status = 'error'; },
    onCanceled: () => { d.status = 'canceled'; d.progressMsg = window.t('whats_new.canceled_msg'); d.canceling = false; }
  };
}

function startWhatsNewTask(taskId) {
  const root = document.getElementById('whats-new-state');
  const d = Alpine.$data(root);
  d.status = 'running';
  d.canceling = false;
  TaskLogDrawer.open(taskId, whatsNewLogOptions());
}
</script>
{% endblock %}
